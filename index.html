<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoEndo 的技术博客</title>
  <meta name="description" content="HoEndo 的技术博客 — 关注 AI 最新资讯与技术前沿，分享 .NET 开发、微服务、架构设计、大模型本地部署等领域的实践经验。">
</head>
<body class="page-home">

  <main class="home-main">
    <div class="home-layout">
      <!-- 左侧：个人简介 -->
      <aside class="home-sidebar">
        <section class="hero">
          <img
            src="assets/img/avatar.png"
            alt="HoEndo 的头像"
            class="hero-avatar"
            onerror="this.style.display='none'"
          >
          <h1 class="hero-name">HoEndo</h1>
          <p class="hero-bio">
            资深 .NET 开发工程师，专注微服务架构、分布式消息、AI 编程应用与大模型本地部署。
                        在这里分享 AI 最新资讯与各技术领域的实践洞察。
          </p>
          <ul class="hero-tags">
            <li>.NET</li>
            <li>微服务</li>
            <li>架构设计</li>
            <li>分布式消息</li>
            <li>AI 编程</li>
            <li>大模型本地部署</li>
            <li>云原生</li>

          </ul>
        </section>
      </aside>

      <!-- 右侧：文章列表 -->
      <div class="home-content">
        <section class="post-list">
          <div class="post-list-header">
            <h2 class="section-title">文章</h2>
            <div class="search-box">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="search" id="searchInput" class="search-input" placeholder="搜索文章..." autocomplete="off">
            </div>
          </div>
          <div class="post-list-body">
            <div id="postListContainer">
              <p class="post-list-loading">加载中...</p>
            </div>
            <nav class="pagination-container" id="paginationNav" aria-label="文章分页"></nav>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="posts.js"></script>
  <script src="assets/js/common.js"></script>
  <script>
    /**
     * 从 POSTS_DATA（posts.js）读取文章列表，分页渲染
     * 每页 6 篇，URL hash 同步页码
     */
    (function () {
      'use strict';

      var container = document.getElementById('postListContainer');
      if (!container) return;

      var POSTS_PER_PAGE = 6;
      var currentPage = 1;

      function getPageFromHash() {
        var match = window.location.hash.match(/^#page=(\d+)$/);
        if (match) {
          var p = parseInt(match[1], 10);
          return p > 0 ? p : 1;
        }
        return 1;
      }

      function setHash(page, replace) {
        var hash = '#page=' + page;
        if (window.location.hash === hash) return;
        if (replace) {
          history.replaceState(null, '', hash);
        } else {
          history.pushState(null, '', hash);
        }
      }

      function escapeHTML(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      function renderCards(posts) {
        var html = '';
        posts.forEach(function (post, i) {
          var tagsHTML = '';
          if (post.tags && post.tags.length > 0) {
            tagsHTML = '<ul class="post-card-tags">';
            post.tags.forEach(function (tag) {
              tagsHTML += '<li>' + escapeHTML(tag) + '</li>';
            });
            tagsHTML += '</ul>';
          }

          html +=
            '<a href="posts/' + escapeHTML(post.slug) + '.html" class="post-card post-card-entering" style="animation-delay:' + (i * 80) + 'ms">' +
              '<h3 class="post-card-title">' + escapeHTML(post.title) + '</h3>' +
              '<div class="post-card-meta">' +
                '<span class="post-card-date">' + escapeHTML(post.date) + '</span>' +
                tagsHTML +
              '</div>' +
              '<p class="post-card-summary">' + escapeHTML(post.summary || '') + '</p>' +
            '</a>';
        });
        return html;
      }

      function renderPagination(totalPages) {
        var paginationNav = document.getElementById('paginationNav');
        if (!paginationNav) return;
        if (totalPages <= 1) {
          paginationNav.innerHTML = '';
          return;
        }

        var html = '';

        // 上一页
        html += '<button class="pagination-btn pagination-prev"';
        if (currentPage <= 1) html += ' disabled aria-disabled="true"';
        html += ' data-page="' + (currentPage - 1) + '" aria-label="上一页">&laquo; 上一页</button>';

        // 页码
        html += '<span class="pagination-pages">';
        for (var i = 1; i <= totalPages; i++) {
          html += '<button class="pagination-btn pagination-num' + (i === currentPage ? ' active' : '') + '"';
          html += ' data-page="' + i + '" aria-label="第 ' + i + ' 页"';
          if (i === currentPage) html += ' aria-current="page"';
          html += '>' + i + '</button>';
        }
        html += '</span>';

        // 下一页
        html += '<button class="pagination-btn pagination-next"';
        if (currentPage >= totalPages) html += ' disabled aria-disabled="true"';
        html += ' data-page="' + (currentPage + 1) + '" aria-label="下一页">下一页 &raquo;</button>';

        paginationNav.innerHTML = html;

        // 绑定点击
        paginationNav.querySelectorAll('.pagination-btn:not([disabled])').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var target = parseInt(this.getAttribute('data-page'), 10);
            if (target && target !== currentPage) {
              showPage(target);
            }
          });
        });
      }

      function showPage(page, replace) {
        var totalPages = Math.ceil(window.POSTS_DATA.length / POSTS_PER_PAGE);
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        if (page === currentPage) return;

        currentPage = page;
        setHash(page, replace);

        var start = (page - 1) * POSTS_PER_PAGE;
        var end = Math.min(start + POSTS_PER_PAGE, window.POSTS_DATA.length);
        var pagePosts = window.POSTS_DATA.slice(start, end);

        // 淡出
        container.style.opacity = '0';
        container.style.transition = 'opacity 150ms ease';

        setTimeout(function () {
          container.innerHTML = renderCards(pagePosts);
          renderPagination(totalPages);

          // 淡入
          requestAnimationFrame(function () {
            container.style.opacity = '1';
          });
        }, 160);
      }

      // 浏览器前进/后退
      window.addEventListener('hashchange', function () {
        var p = getPageFromHash();
        if (p !== currentPage) {
          showPage(p, true);
        }
      });

      // 初始加载
      var posts = window.POSTS_DATA;
      if (!posts || !Array.isArray(posts) || posts.length === 0) {
        container.innerHTML = '<p class="post-list-loading">还没有文章，敬请期待。</p>';
        return;
      }

      posts.sort(function (a, b) {
        return b.date.localeCompare(a.date);
      });

      var totalPages = Math.ceil(posts.length / POSTS_PER_PAGE);
      var page = getPageFromHash();
      if (page > totalPages) page = totalPages;
      currentPage = page;

      var start = (page - 1) * POSTS_PER_PAGE;
      var end = Math.min(start + POSTS_PER_PAGE, posts.length);
      container.innerHTML = renderCards(posts.slice(start, end));
      renderPagination(totalPages);

      // 设置初始 hash
      if (!window.location.hash.match(/^#page=\d+$/)) {
        setHash(page, true);
      }

      container.style.transition = 'opacity 150ms ease';

      // ========== 搜索功能 ==========
      var searchInput = document.getElementById('searchInput');
      var searchTimeout = null;

      if (searchInput) {
        searchInput.addEventListener('input', function () {
          var query = this.value.trim().toLowerCase();

          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(function () {
            if (query === '') {
              // 清空搜索：恢复分页视图
              container.style.opacity = '0';
              setTimeout(function () {
                var start = (currentPage - 1) * POSTS_PER_PAGE;
                var end = Math.min(start + POSTS_PER_PAGE, window.POSTS_DATA.length);
                container.innerHTML = renderCards(window.POSTS_DATA.slice(start, end));
                renderPagination(Math.ceil(window.POSTS_DATA.length / POSTS_PER_PAGE));
                requestAnimationFrame(function () {
                  container.style.opacity = '1';
                });
              }, 160);
              return;
            }

            // 按标题和标签过滤
            var filtered = window.POSTS_DATA.filter(function (post) {
              if (post.title.toLowerCase().indexOf(query) !== -1) return true;
              if (post.tags && post.tags.length > 0) {
                for (var i = 0; i < post.tags.length; i++) {
                  if (post.tags[i].toLowerCase().indexOf(query) !== -1) return true;
                }
              }
              return false;
            });

            // 渲染过滤结果
            container.style.opacity = '0';
            setTimeout(function () {
              if (filtered.length > 0) {
                container.innerHTML = renderCards(filtered);
              } else {
                container.innerHTML = '<p class="post-list-empty">没有找到匹配的文章</p>';
              }
              // 隐藏分页器
              var paginationNav = document.getElementById('paginationNav');
              if (paginationNav) paginationNav.innerHTML = '';
              requestAnimationFrame(function () {
                container.style.opacity = '1';
              });
            }, 160);
          }, 150); // 150ms 防抖
        });
      }
    })();
  </script>

</body>
</html>
